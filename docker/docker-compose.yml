# One image, one container, one process: it refreshes the OAuth token, serves
# the usage numbers on its own localhost, renders claude_usage.star, and pushes
# the frame to the tronbyt-server — all in a single Python process.
#
# Both secrets are supplied via .env — no files to transfer. Copy .env.example
# to .env, paste your credential into CLAUDE_CREDENTIALS_JSON, fill in the API
# key. See INSTALL.md for a step-by-step.
#
# The image is published at docker.io/taylorlbird/claude-usage. Just
# `docker compose pull && docker compose up -d`. To rebuild it yourself instead
# of pulling, uncomment the `build:` block and run `docker compose up -d --build`.
services:
  claude-usage:
    image: taylorlbird/claude-usage:latest
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    environment:
      # PREFERRED: a long-lived token from `claude setup-token`. When set, this
      # is used directly and nothing is ever refreshed — which keeps the
      # rate-limited (HTTP 429) token endpoint out of the path entirely. Set this
      # and you can leave CLAUDE_CREDENTIALS_JSON empty.
      CLAUDE_OAUTH_TOKEN: ${CLAUDE_OAUTH_TOKEN:-}
      # Fallback: the initial credential, pasted in like the API key. On first boot the
      # process seeds /config/credentials.json from this; after that the living,
      # rotated token lives in the volume and this value is only used to recover
      # if the stored token dies (see INSTALL.md).
      CLAUDE_CREDENTIALS_JSON: ${CLAUDE_CREDENTIALS_JSON:-}
      TRONBYT_URL: ${TRONBYT_URL}
      DEVICE_ID: ${DEVICE_ID}
      API_KEY: ${API_KEY}
      INSTALL_ID: ${INSTALL_ID:-claudeusage}
      PUSH_INTERVAL: ${PUSH_INTERVAL:-60}
      # Flush print() immediately so `docker compose logs` shows output live.
      PYTHONUNBUFFERED: "1"
    volumes:
      # Docker-managed named volume — nothing to create or transfer. The rotated
      # refresh token is written here so it survives restarts.
      - claude-creds:/config
    restart: unless-stopped

volumes:
  claude-creds:
